services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crediscout
      POSTGRES_PASSWORD: crediscout-dev
      POSTGRES_DB: crediscout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local stand-in for Cloudflare R2 (same S3-compatible API).
  # MinIO was requested but is uninstallable here (Docker Hub repo removed,
  # no Windows binary published) — Adobe S3Mock fills the same role free.
  # Creates the bucket on start.
  s3:
    image: adobe/s3mock:latest
    restart: unless-stopped
    command: ["--initialBuckets=crediscout-documents"]
    ports:
      - "9090:9090"
    volumes:
      - s3mockdata:/s3mockroot

  # App container (opt-in: local dev normally runs `npm run dev`)
  web:
    build: .
    profiles: ["app"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://crediscout:crediscout-dev@postgres:5432/crediscout?schema=public
      S3_ENDPOINT_LOCAL: http://s3:9090
    depends_on:
      - postgres
      - s3

volumes:
  pgdata:
  s3mockdata:
