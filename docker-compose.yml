services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crediscout
      POSTGRES_PASSWORD: crediscout-dev
      POSTGRES_DB: crediscout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local stand-in for Cloudflare R2 (same S3-compatible API).
  # LocalStack S3 only — no auth needed (use test/test), endpoint :4566.
  s3:
    image: localstack/localstack:latest
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - localstackdata:/var/lib/localstack

  # App container (opt-in: local dev normally runs `npm run dev`)
  web:
    build: .
    profiles: ["app"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://crediscout:crediscout-dev@postgres:5432/crediscout?schema=public
      S3_ENDPOINT_LOCAL: http://s3:4566
    depends_on:
      - postgres
      - s3

volumes:
  pgdata:
  localstackdata:
