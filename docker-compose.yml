services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crediscout
      POSTGRES_PASSWORD: crediscout-dev
      POSTGRES_DB: crediscout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local stand-in for Cloudflare R2 (same S3-compatible API)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # App container (opt-in: local dev normally runs `npm run dev`)
  web:
    build: .
    profiles: ["app"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://crediscout:crediscout-dev@postgres:5432/crediscout?schema=public
      S3_ENDPOINT_LOCAL: http://minio:9000
    depends_on:
      - postgres
      - minio

volumes:
  pgdata:
  miniodata:
