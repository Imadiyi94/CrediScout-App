# Netlify deployment (Next.js Runtime auto-detected).
[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "22"

# Keep pdfkit's lazy-loaded font assets in the serverless bundle.
[functions]
  included_files = ["node_modules/pdfkit/**"]
